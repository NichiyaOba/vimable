customCommands:
  - key: 'c'
    context: 'files'
    command: '/Users/oba_nichiya/.nvm/versions/node/v22.21.1/bin/cz'
    description: 'Commit with cz-git'
    output: terminal
gui:
  splitDiff: 'horizontal'
git:
  diffRenderers:
    # ~/.gitconfig の side-by-side は lazygit の狭い diff 欄では折り返しだらけになるため、
    # git 設定を読まずに 1 列表示にする（ターミナルの git diff は左右分割のまま）
    - colorArg: always
      command: delta --no-gitconfig --dark --paging=never --line-numbers --syntax-theme Dracula
